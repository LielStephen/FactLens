<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Background: Deep Obsidian Slate Container with subtle border -->
  <rect width="64" height="64" rx="14" fill="#090d16"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Optical Grid & Alignment Crosshairs -->
  <line x1="12" y1="32" x2="20" y2="32" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="32" x2="52" y2="32" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="12" x2="32" y2="20" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="44" x2="32" y2="52" stroke="#334155" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Precision Evidence Grounding Brackets (Top-Left & Bottom-Right) -->
  <path d="M 21 27 L 21 21 L 27 21" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 43 27 L 43 21 L 37 21" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 21 37 L 21 43 L 27 43" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 43 37 L 43 43 L 37 43" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Optical Lens Ring -->
  <circle cx="32" cy="32" r="7" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 2"/>

  <!-- Grounded Truth Precision Focal Pip -->
  <circle cx="32" cy="32" r="2.5" fill="#38bdf8"/>
</svg>
